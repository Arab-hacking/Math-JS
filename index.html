<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <script>
      const log = console.log.bind(console);
      // Функция abs() возвращает абсолютное значение числа:
      let x = -25;
      log(Math.abs(x));   // 25
      let y = 34;
      log(Math.abs(y));   // 34

      /* Функция ceil() округляет число 
      до следующего наибольшего целого числа: */
      log(Math.ceil(3.7))      // 4
      log(Math.ceil(-5.9))     // 5

      /* Функция floor() округляет число 
      до ближайшего меньшего или равного целого числа: */
      log(Math.floor(3.2))     // 3
      log(Math.floor(-5.9))    // -6

      /* Функция round() округляет число 
      до следующего наименьшего целого числа, 
      если его десятичная часть меньше 0.5. 
      Если же десятичная часть равна или больше 0.5, 
      то округление идёт до ближайшего наибольшего целого числа: */
      let x1 = Math.round(5.5); // 6
      let y1 = Math.round(5.4); // 5
      let z = Math.round(-5.4); // -5
      let n = Math.round(-5.5); // -5
      let m = Math.round(-5.6); // -6
      log("5.5 равна: "+ x);
      log("5.4 равна: "+ y);
      log("-5.4 равна: "+ z);
      log("-5.6 равна: "+ n);

      /* Функция pow() возвращает число в определенной степени. 
      Например, возведём число 2 в степень 3: */
      let x2 = (Math.pow(2,68))
      log("2 в степени 68 равна: " + x2)
      
      // Функция sqrt() возвращает квадратный корень числа:
      let x3 = Math.sqrt(121); // 11
      let y2 = Math.sqrt(9); // 3
      let z1 = Math.sqrt(20); // 4.47213595499958

      /* Функции min() и max() возвращают соответственно минимальное 
      и максимальное значение из набора чисел: */
      log(Math.min(3, 6))
      log(Math.min(64, 23))

    </script>
  </body>
</html>
